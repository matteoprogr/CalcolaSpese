<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolo Spese Mensili</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">

    <!-- Per iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-orientation" content="landscape">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>

<!-- Navbar -->
<nav class="mobile-nav">
    <input type="checkbox" id="nav-toggle" class="nav-toggle" />
    <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
    </label>
    <div class="nav-links">
        <a href="#" data-target="inserisci-spesa">Aggiungi Spese</a>
        <a href="#" data-target="traccia-spesa">Traccia Spese</a>
        <a href="#" data-target="elabora-excel">Elabora Excel</a>
    </div>
</nav>


<h1 class="page-title">TieniIlConto</h1>
<button id="fullscreenBtn" style="display:none;">📱 Schermo Intero</button>

<section id="inserisci-spesa" class="page-section active">
    <div class="insert-container">
            <form id="modalForm" style="margin: 1vw; text-align: left;">
                <h2>Inserisci Spesa</h2>
                <label>Categoria:<br><input type="text" name="categoria" required></label>
                <label>Data:<br><input type="date" name="dataSpesa" required></label>
                <label>Importo (€):<br><input type="number" name="importo" step="0.01" required></label>
                <label>Descrizione:<br><input type="text" name="descrizione"></label>
                <div style="margin-top: 15px; text-align: right;">
                    <button type="submit">Salva</button>
                </div>
            </form>
    </div>
</section>

<!-- Pagina Elabora Excel -->
<section id="elabora-excel" class="page-section">
    <div class="excel-container">
        <div class="excel-form">
            <h2>Importa il tuo file Excel</h2>
            <form id="uploadForm">
                <div class="form-row">
                    <input type="file" id="fileInput" name="file" accept=".xls,.xlsx" required/>
                    <label>Nome della tua banca</label>
                    <select id="nomeBanca" required>
                        <option value="" disabled selected>-- Seleziona --</option>
                        <option value="ingDirect">IngDirect</option>
                    </select>

                    <label for="startDate">Da:</label>
                    <input type="date" id="startDate" name="startDate">

                    <label for="endDate">A:</label>
                    <input type="date" id="endDate" name="endDate">
                </div>


                <div class="form-row">
                    <button type="submit">Invia</button>
                </div>

            </form>
        </div>

      <div class="table-container">
            <div class="table-header">
                <button id="mergeRowsBtn" style="display: none;" title="Unisci righe selezionate">Unisci righe</button>
                <button id="removeRowsBtn" style="display: none;" title="Rimuovi righe selezionate">Rimuovi righe</button>
                <button id="uploadResultBtn" style="display: none;"title="Scarica in formato excel">Download Excel</button>
            </div>

            <table id="resultsTable" style="display: none;">
                <thead>
                <tr>
                    <th>Includi</th>
                    <th>Categoria / Presso</th>
                    <th>Importo (€)</th>
                </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>

            <div class="table-header-tot">
                <table id="resultsTableTot" style="display: none;">
                    <tbody id="resultsBodyTot"></tbody>
                </table>
            </div>
          </div>
    </div>
<!--    <div class="rotateOverlay">-->
<!--        <p> Per una miglore visualizzazione <br> Ruota il dispositivo 🔄 e imposta lo schermo intero <br> premendo l'icona in basso a sinistra</p>-->
<!--    </div>-->
</section>

<section id="traccia-spesa" class="page-section">
    <div class="excel-container">
        <div class="excel-form">
        <h2>Traccia spese</h2>
            <form id="manualForm">
                <div class="form-row">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria"></select>

                    <label for="importo">Importo (€)</label>
                    <input type="number" step="0.01" id="importo" name="importo">

                    <label for="startDateExpense">Data inizio</label>
                    <input type="date" id="startDateExpense" name="startDateExpense">

                    <label for="endDateExpense">Data fine</label>
                    <input type="date" id="endDateExpense" name="endDateExpense">
                </div>

                <div class="form-row">
                    <button id="getSpesaBtn">Ricerca spesa</button>
                    <button id="deleteSpesaBtn" title="Elimina la spesa selezionata">Elimina spesa</button>
                </div>
            </form>
        </div>

        <div class="table-container">

            <table id="resultsTableManual" style="display: none;">
                <colgroup>
                    <col style="width: 5%">
                    <col style="width: 20%">
                    <col style="width: 20%">
                    <col style="width: 35%">
                    <col style="width: 20%">
                </colgroup>
                <thead>
                <tr>
                    <th></th> <!--colonna del check box non serve nome -->
                    <th>Data Spesa</th>
                    <th>Categoria</th>
                    <th>Descrizione</th>
                    <th>Importo (€)</th>
                </tr>
                </thead>
                <tbody id="resultsBodyManual"></tbody>
            </table>

            <div class="table-header-tot">
                <table id="resultsTableTotManual" style="display: none;">
                    <tbody id="resultsBodyTotManual"></tbody>
                </table>
            </div>

        </div>

    </div>
<!--    <div class="rotateOverlay">-->
<!--        <p>Per una migliore visualizzazione ruota  <br>il dispositivo 🔄 e imposta lo schermo intero <br>premendo l'icona in basso a sinistra</p>-->
<!--    </div>-->

</section>

<script type="module" src="upload.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>


</body>
</html>
