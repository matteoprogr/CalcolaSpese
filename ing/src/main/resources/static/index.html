<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolo Spese Mensili</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

<!-- Titolo principale della pagina -->
<h1 class="page-title">Gestione Spese</h1>

<div class="forms-container">
    <!-- Wrapper per titolo + primo form -->
    <div class="form-block">
        <h2>Importa il tuo file Excel</h2>

        <form id="uploadForm">
            <input type="file" id="fileInput" name="file" accept=".xls,.xlsx" required/>
            <label class="indexlabel">Inserisci il nome della tua banca</label>
            <select id="nomeBanca" required>
                <option value="" disabled selected>-- Seleziona --</option>
                <option value="ingDirect">IngDirect</option>
            </select>

            <label class="indexlabel" for="startDate">Da:</label>
            <input type="date" id="startDate" name="startDate">

            <label class="indexlabel" for="endDate">A:</label>
            <input type="date" id="endDate" name="endDate">

            <button type="submit">Invia</button>
        </form>
    </div>

    <!-- Secondo form -->
    <div class="form-block">
        <h2>Aggiungi spesa manualmente</h2>

        <form id="manualForm">
            <label class="indexlabel" for="categoria">Categoria / Presso</label>
            <input type="text" id="categoria" name="categoria" required>

            <label class="indexlabel" for="importo">Importo (€)</label>
            <input type="number" step="0.01" id="importo" name="importo" required>

            <label class="indexlabel" for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" name="descrizione" required>

            <label class="indexlabel" for="dataSpesa">Data</label>
            <input type="date" id="dataSpesa" name="dataSpesa">

            <label class="indexlabel" for="startDateExpense">Data inizio ricorrenza</label>
            <input type="date" id="startDateExpense" name="startDateExpense">

            <label class="indexlabel" for="endDateExpense">Data fine ricorrenza</label>
            <input type="date" id="endDateExpense" name="endDateExpense">

            <label class="indexlabel" for="recurrence">Ricorrenza</label>
            <select id="recurrence" name="recurrence">
                <option value="">-- Seleziona --</option>
                <option value="daily">Giornaliera</option>
                <option value="weekly">Settimanale</option>
                <option value="monthly">Mensile</option>
                <option value="yearly">Annuale</option>
            </select>

            <label class="indexlabel" for="includi">
                <input type="checkbox" id="includi" name="includi">
                Includi nella tabella
            </label>

            <button type="submit">Aggiungi spesa</button>
        </form>
    </div>
</div>


<div class="table-container">
    <div class="table-header">
        <button id="mergeRowsBtn" style="display: none;">Unisci righe selezionate</button>
        <button id="removeRowsBtn" style="display: none;">Rimuovi righe selezionate</button>
        <button id="uploadResultBtn" style="display: none;">Download Excel</button>
    </div>

    <table id="resultsTable" style="display: none;">
        <thead>
        <tr>
            <th>Includi</th>
            <th>Categoria / Presso</th>
            <th>Importo (€)</th>
        </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
    </table>
    <div class="table-header-tot">
        <table id="resultsTableTot" style="display: none;">
            <thead>
            </thead>
            <tbody id="resultsBodyTot">
            </tbody>
        </table>
    </div>
</div>


<script type="module" src="upload.js"></script>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
