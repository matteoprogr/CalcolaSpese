<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolo Spese Mensili</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        /* Stile base per i contenitori dei datepicker */
        .datepicker-container {
            display: inline-block;
            margin-right: 20px;
        }
    </style>
</head>
<body>
<h1>Carica file Excel e seleziona mese</h1>

<form id="uploadForm">
    <input type="file" id="fileInput" name="file" accept=".xls,.xlsx" required/>

    <input type="date" id="startDate">
    <input type="date" id="endDate">

    <button type="submit">Invia</button>
</form>

<div class="table-container">
    <div class="table-header">
        <button id="mergeRowsBtn" style="display: none;">Unisci righe selezionate</button>
        <button id="removeRowsBtn" style="display: none;">Rimuovi righe selezionate</button>
        <button id="uploadResultBtn" style="display: none;">Scarica Elaborazione</button>
    </div>

    <div id="rowContainer"></div>

    <table id="resultsTable" style="display: none;">
        <thead>
        <tr>
            <th>Includi</th>
            <th>Categoria / Presso</th>
            <th>Importo (€)</th>
        </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
    </table>
    <div class="table-header-tot">
        <table id="resultsTableTot" style="display: none;">
            <thead>
            </thead>
            <tbody id="resultsBodyTot">
            </tbody>
        </table>
    </div>
</div>


<script src="upload.js"></script>
<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
