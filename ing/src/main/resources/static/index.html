<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolo Spese Mensili</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Carica file Excel e seleziona mese</h1>

<form id="uploadForm">
    <input type="file" id="fileInput" name="file" accept=".xls,.xlsx" required />

    <label for="monthSelect">Mese:</label>
    <select id="monthSelect" required>
        <option value="">-- Seleziona --</option>
        <option value="1">Gennaio</option>
        <option value="2">Febbraio</option>
        <option value="3">Marzo</option>
        <option value="4">Aprile</option>
        <option value="5">Maggio</option>
        <option value="6">Giugno</option>
        <option value="7">Luglio</option>
        <option value="8">Agosto</option>
        <option value="9">Settembre</option>
        <option value="10">Ottobre</option>
        <option value="11">Novembre</option>
        <option value="12">Dicembre</option>
    </select>

    <button type="submit">Invia</button>
</form>

<h2>Risultati:</h2>

<div class="table-container">
    <div class="table-header">
        <button id="mergeRowsBtn" style="display: none;">Unisci righe selezionate</button>
        <button id="uploadResultBtn" style="display: none;">Scarica risultati</button>
    </div>

    <table id="resultsTable" style="display: none;">
        <thead>
        <tr>
            <th>Includi</th>
            <th>Categoria / Presso</th>
            <th>Importo (€)</th>
        </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
    </table>
</div>


<script src="upload.js"></script>
</body>
</html>
